<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アイカツ！カード所持チェッカー</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Murecho:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. 変数・基本設定
       ========================================================================== */
    :root {
      --bg-color: #fce4ec;
      --card-bg: #ffffff;
      --text-main: #4a4a4a;
      
      /* タイプ別テーマカラー */
      --cute-color: #ff69b4;
      --cute-bg: #fff0f5;
      --cool-color: #1e90ff;
      --cool-bg: #f0f8ff;
      --sexy-color: #9370db;
      --sexy-bg: #f8f8ff;
      --pop-color: #ff8c00;
      --pop-bg: #fffaf0;
      
      --rarity-sec: #ffd700;
      --rarity-pr: #ff69b4;
      --rarity-r: #1e90ff;
      --rarity-n: #a9a9a9;

      --font-heading: 'Dela Gothic One', cursive, sans-serif;
      --font-body: 'Zen Maru Gothic', sans-serif;
      --font-ui: 'Murecho', sans-serif;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(#ffb6c1 15%, transparent 16%),
        radial-gradient(#ffb6c1 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 20px 10px 60px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ==========================================================================
       2. ヘッダー＆プログレス
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-family: var(--font-heading);
      color: #ff1493;
      font-size: 2.2rem;
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 4px 8px rgba(0,0,0,0.15);
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .dashboard {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      border: 3px solid #ffb6c1;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-ui);
      font-weight: 700;
    }

    .stats-count {
      font-size: 1.1rem;
      color: #333;
    }

    .stats-count span {
      font-size: 1.5rem;
      color: #ff1493;
      font-family: var(--font-heading);
    }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background-color: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #e0e0e0;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff69b4, #ff1493);
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 8px;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      font-weight: 900;
      color: #333;
      text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
    }

    /* ==========================================================================
       3. フィルター＆操作パネル
       ========================================================================== */
    .controls-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(5px);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 2px solid #fff;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #666;
      min-width: 60px;
    }

    select, input[type="text"] {
      padding: 8px 12px;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: #ff1493;
    }

    .search-input {
      flex: 1;
      min-width: 160px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-primary {
      background: #ff1493;
      color: #fff;
    }
    .btn-primary:hover { background: #e01180; }

    .btn-secondary {
      background: #fff;
      color: #555;
      border: 2px solid #ddd;
    }
    .btn-secondary:hover { background: #f5f5f5; }

    .btn-success {
      background: #4caf50;
      color: #fff;
    }
    .btn-danger {
      background: #f44336;
      color: #fff;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px dashed #ffb6c1;
      padding-top: 12px;
    }

    /* ==========================================================================
       4. カードグリッド＆3Dフリップ
       ========================================================================== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    @media (min-width: 600px) {
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 20px;
      }
    }

    .card-item {
      perspective: 1000px;
      height: 260px;
    }

    .card-inner {
